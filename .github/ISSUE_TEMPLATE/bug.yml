name: Bug
description: Report a documentation site bug (build, navigation, rendering, deploy)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL (if applicable)
      placeholder: https://limitlesslearning.github.io/docs/...
  - type: dropdown
    id: environment
    attributes:
      label: Where did you see this?
      options:
        - Local `pnpm run dev`
        - Local `pnpm run build` / preview
        - GitHub Pages production
        - CI workflow
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Logs / screenshots
      description: Paste build errors or attach screenshots if useful.
